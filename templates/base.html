{% load static event_extras %}<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}{{ event.title|default:"آلبوم عروسی" }}{% endblock %}</title>

  {% block og %}{% endblock %}

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700&family=Pinyon+Script&family=Vazirmatn:wght@300;400;500;700&display=swap">

  <link rel="stylesheet" href="{% static_v 'dist/app.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body class="bg-pearl text-ink font-body">
  {% block content %}{% endblock %}
  {% block extra_scripts %}{% endblock %}
</body>
</html>
