name: wedding

services:
  db:
    image: postgres:16
    restart: unless-stopped
    # env_file (not `environment: ${VAR}`) — compose only reads ${VAR}
    # interpolation from the shell or a literal .env, never from env_file,
    # so an explicit `environment:` here would silently evaluate to blank
    # and override the real value from .env.prod.
    env_file: .env.prod
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ (not $) so this substitutes at container runtime, from the env
      # env_file actually set, not at compose-parse time.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        REQUIREMENTS: requirements/prod.txt
    restart: unless-stopped
    # forwarded-allow-ips="*" is safe here: app:8000 is only reachable from
    # our own nginx, over our own isolated network, never from the host.
    # gthread, not sync: a sync worker blocks entirely for a slow guest
    # upload's whole duration; threads let one process hold several such
    # connections open at once. Sized for this box's 2 cores / ~3.8GB RAM,
    # shared with other apps.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 4 --worker-class gthread --timeout 60 --forwarded-allow-ips='*'"
    env_file: .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    volumes:
      - ./media:/app/media
      - static_files:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: .
      args:
        REQUIREMENTS: requirements/prod.txt
    restart: unless-stopped
    command: celery -A config worker -l info
    env_file: .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    volumes:
      - ./media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./media:/media
      - static_files:/static:ro
    # No ports published — this host already has a shared edge nginx on
    # 80/443 for other sites. It reverse-proxies to this container by name
    # (wedding-nginx-1) over the external network joined below. See
    # docs/DEPLOY.md.
    networks:
      - default
      - edge
    depends_on:
      - app

networks:
  edge:
    external: true
    name: edge_default

volumes:
  static_files:
