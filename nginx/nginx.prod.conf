# This nginx only ever talks to the shared edge nginx on the host (which
# terminates TLS and reverse-proxies to us by container name — see
# docs/DEPLOY.md). It never listens on a host-published port itself.
client_max_body_size 30m;

server {
    listen 80;
    server_name photos.example.com;

    location /static/ {
        alias /static/;
    }

    # Public media requests go to Django for the visibility check; Django
    # never streams the bytes itself, it answers with X-Accel-Redirect and
    # nginx serves the file from the internal-only location below.
    location /media/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Passed through as-is from the edge nginx, which set it based on
        # the client's real scheme (https) — recomputing $scheme here would
        # say "http", since edge-to-here is a plain internal hop.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /protected-media/ {
        internal;
        alias /media/;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
