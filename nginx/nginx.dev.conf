client_max_body_size 30m;

server {
    listen 80;

    location /static/ {
        alias /static/;
    }

    # Public media requests go to Django for the visibility check; Django
    # never streams the bytes itself, it answers with X-Accel-Redirect and
    # nginx serves the file from the internal-only location below.
    location /media/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /protected-media/ {
        internal;
        alias /media/;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
